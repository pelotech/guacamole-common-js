name: Release

# A push to main whose package.json version is not published yet is built from the Apache tag, tested and staged on
# npm through the trusted publisher binding (OIDC, no token). A maintainer approves it with `npm stage approve` and
# 2FA; nothing goes live from here.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: package
        run: echo "spec=$(node -p "require('./package.json').name + '@' + require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: published
        name: Published already
        run: |
          if npm view "${{ steps.package.outputs.spec }}" version > /dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.yes != 'true'
        run: npm ci
      - if: steps.published.outputs.yes != 'true'
        run: npm run build
      - if: steps.published.outputs.yes != 'true'
        run: npm test
      - if: steps.published.outputs.yes != 'true'
        name: Stage on npm, or report the version as staged already and awaiting approval
        run: |
          if npm stage publish 2>&1 | tee stage.log; then
            exit 0
          fi
          if grep -qiE "already (exists|staged|published)|EPUBLISHCONFLICT|E409" stage.log; then
            echo "::notice::${{ steps.package.outputs.spec }} is staged already; approve it with npm stage approve"
            exit 0
          fi
          exit 1
